version: "3.8"

services:
  web:
    build: .
    # Для проверки воркера лучше без --reload: reloader запускает второй процесс
    # и планировщик может стартовать дважды.
    # Сначала применяем миграции, затем запускаем API.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - RUN_WORKER=true
    volumes:
      - .:/app
    depends_on:
      postgres_db:
        condition: service_healthy
      qdrant:
        condition: service_started

  postgres_db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: my_service_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d my_service_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  pgdata:
  qdrant_data:
